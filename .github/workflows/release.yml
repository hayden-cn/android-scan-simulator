name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    name: Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 从 tag 拿版本号（v1.2.3 -> 1.2.3）
      # 手动触发时回退到 Cargo.toml 里的版本
      - name: Resolve version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $version = python -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])"
          }
          "VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Resolved version: $version"

      - name: Build app
        run: cargo build --release

      - name: Package portable zip
        shell: pwsh
        run: |
          $name = "android-scan-simulator"
          $exe  = "target/release/$name.exe"
          if (-not (Test-Path $exe)) { throw "未找到可执行文件：$exe" }

          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null

          $zip = "dist-portable/${name}_${{ env.VERSION }}_x64-portable.zip"
          Compress-Archive -Path $exe -DestinationPath $zip -Force

          Get-ChildItem $zip | Select-Object Name, Length

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist-portable/*.zip
          body: |
            Windows 便携版：解压后直接运行 android-scan-simulator.exe
            需系统已安装 WebView2 运行时。
          draft: false
          prerelease: false

      - name: Upload workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: android-scan-simulator-portable-${{ env.VERSION }}
          path: dist-portable/*.zip
